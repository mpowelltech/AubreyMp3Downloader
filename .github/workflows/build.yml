name: Build Windows EXE

on:
  workflow_dispatch:        # build on demand from the Actions tab
  push:
    tags: ["v*"]            # ...and on a version tag, attaching the exe to a Release

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write          # needed to create the Release and upload the exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download static ffmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extract
          $exe = Get-ChildItem -Path ffmpeg_extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Copy-Item $exe.FullName build/ffmpeg.exe
          Write-Host "Bundled ffmpeg from $($exe.FullName)"

      - name: Build exe
        run: pyinstaller AubreyMp3.spec

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aubreys-YT-MP3-Downloader
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
